# Release for @alplus/sdk to npm, destined for Alplus-Tech/sdk-js.
# Manual or tag-driven only; a product change can never publish an SDK.
#
# Publishing uses npm trusted publishing (OIDC) -- the registry's preferred
# mechanism, no long-lived NPM_TOKEN. Configure @alplus/sdk's trusted publisher
# in the npm package settings to accept Alplus-Tech/sdk-js + this workflow.
#
# Two prerequisites are easy to get wrong, and both fail as a bare `404 Not
# Found - PUT` on a package that plainly exists:
#
#  1. OIDC needs npm >= 11.5.1. Node 20 ships npm 10, so npm is upgraded below
#     rather than switching the whole job to Node 24 -- tests must keep running
#     on the floor of `engines.node`, which is what caught the
#     `Promise.withResolvers` breakage.
#  2. No `registry-url:` on setup-node. It writes an .npmrc with
#     `_authToken=${NODE_AUTH_TOKEN}`, and with no token set npm sends the
#     literal placeholder and never attempts OIDC.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (provenance)

env:
  CONTRACT_REF: contract-v1.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned contract
        uses: actions/checkout@v4
        with:
          repository: Alplus-Tech/alplus
          ref: ${{ env.CONTRACT_REF }}
          token: ${{ secrets.CONTRACT_REPO_TOKEN }}
          sparse-checkout: sdks/contract
          path: .contract-src

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci
      - run: npm run typecheck
      - name: Verify before publish
        env:
          ALPLUS_CONTRACT_DIR: ${{ github.workspace }}/.contract-src/sdks/contract
        run: npm test
      - run: npm run build
      # Trusted publishing (OIDC) and --provenance both need npm >= 11.5.1; the
      # Node 20 bundle is npm 10, which authenticates with an .npmrc token only.
      # Pin the 11 line: npm@latest is 12.x and requires Node 22+, so
      # `npm@latest` fails EBADENGINE on this runner.
      - run: npm install -g npm@11
      - run: npm --version
      - run: npm publish --provenance --access public
